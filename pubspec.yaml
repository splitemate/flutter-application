name: splitemate
description: "Splitemate"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  jwt_decoder: ^2.0.1
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  gradient_borders: ^1.0.1
  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  otp_pin_field: ^1.4.1
  google_sign_in: ^7.1.1
  sqflite: ^2.4.2
  path: ^1.9.1
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  mobile_scanner: ^7.0.1
  vibration: ^3.1.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google-services.json

  fonts:
    - family: GT-Walsheim-Pro
      fonts:
        - asset: assets/fonts/GTWalsheimProRegular.ttf
        - asset: assets/fonts/GTWalsheimProBold.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Black.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 600
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Bold.ttf
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 600
